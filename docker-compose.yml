services:
  mongo:
    image: mongo:7
    container_name: soloswim-mongo
    restart: always
    volumes:
      - soloswim_mongo_data:/data/db
    # Not published to the internet. Only reachable on the Docker network.
    # Optional local admin access from the server itself:
    # ports:
    #   - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - proxy

  soloswim:
    image: swimcare/soloswim:latest
    container_name: soloswim
    # Runtime secrets/config: HOST, STRIPE_*, MAILGUN_*, etc.
    env_file: ".env"
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "2379:3000"
    networks:
      - proxy
    environment:
      # Prefer the local Docker Mongo service over Atlas
      MONGODB_URL: mongodb://mongo:27017/soloswim
      url: https://www.soloswim.be
      VIRTUAL_HOST: soloswim.be,www.soloswim.be
      LETSENCRYPT_HOST: soloswim.be,www.soloswim.be
      LETSENCRYPT_EMAIL: kristof@soloswim.be

networks:
  proxy:
    external: true

volumes:
  soloswim_mongo_data:
